name: Skill cloud bridge contract tests

on:
  push:
    branches:
      - feature/skill-web-unification-v1-20261107
      - 'feature/issue21-*'
  pull_request:
    paths:
      - "skills/handraw-cloud/**"
      - "skills/personal-library/**"
      - "skills/community-share/scripts/conversation_share.py"
      - "scripts/handraw_cloud.py"
      - ".github/workflows/skill-cloud-tests.yml"

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install share test dependency
        run: python -m pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: |
          python -m compileall -q skills/handraw-cloud/scripts/handraw_cloud.py
          python -m compileall -q skills/personal-library/scripts/personal_library.py
          python -m compileall -q skills/community-share/scripts/conversation_share.py
      - name: Run offline cloud contract tests
        run: python -m unittest discover -s skills/handraw-cloud/tests -p 'test_*.py' -v
      - name: Run existing community-share regression tests
        run: python -m pytest skills/community-share/tests -q
